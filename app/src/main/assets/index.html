<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon Blocks</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070852;color:#f7f8ff;font-family:system-ui,-apple-system,sans-serif}
body{background:linear-gradient(180deg,#17188d 0%,#0a0b63 22%,#05063d 100%)}
button{font:inherit;color:inherit}
#app{height:100dvh;display:flex;flex-direction:column;gap:4px;padding:calc(env(safe-area-inset-top) + 4px) 4px calc(env(safe-area-inset-bottom) + 4px)}
.hud{display:grid;grid-template-columns:1fr 1fr 1.18fr 46px;gap:4px;flex:0 0 auto;min-height:48px}
.hudBox,.menuToggle{border:1px solid #5668df;background:#11156f;border-radius:3px;box-shadow:inset 0 0 0 1px #2430a1;text-align:center}
.hudBox{padding:3px 2px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.hudBox small{font-size:8px;line-height:1;color:#66d3df;letter-spacing:1px;font-weight:900;text-transform:uppercase}
.hudBox b{font-size:18px;line-height:1.15;color:#fff;font-weight:900}
.hudBox.scoreBox{background:#22269b;transform:skew(-1.5deg)}
.menuWrap{position:relative;z-index:20}
.menuToggle{width:46px;height:100%;min-height:48px;font-size:23px;font-weight:900;cursor:pointer}
.quickMenu{display:none;position:absolute;right:0;top:calc(100% + 5px);width:164px;padding:5px;background:#0c0e62f5;border:1px solid #596ce4;border-radius:6px;box-shadow:0 10px 28px #0009}
.quickMenu.open{display:block}
.quickMenu button{width:100%;min-height:44px;border:0;border-radius:4px;background:transparent;text-align:left;padding:9px 10px;font-size:14px;cursor:pointer}
.quickMenu button:active{background:#242a9c}
.gameArea{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.boardWrap{position:relative;flex:0 0 auto;border:1px solid #00b9ff;background:#10237e;box-shadow:0 0 0 1px #1665da,0 0 20px #008cff44;overflow:hidden}
#board{display:block;width:100%;height:100%;touch-action:none;background:#10237e}
.floating{position:absolute;top:5px;z-index:5;width:48px;border:1px solid #005ad8;background:#09175bdd;box-shadow:inset 0 0 0 1px #1639a5;color:#66ddeb;text-align:center;pointer-events:auto}
.floating small{display:block;padding:3px 1px 1px;font-size:7px;font-weight:900;letter-spacing:.7px}
#holdPanel{left:5px;cursor:pointer}
#nextPanel{right:5px}
.floating canvas{display:block;width:100%;height:auto}
.cover{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;text-align:center;background:#09145eea;padding:16px}
.cover.hidden{display:none}
.cover h2{margin:0 0 10px;font-size:28px;letter-spacing:1px;color:#fff;text-shadow:0 0 14px #00dbff}
.cover p{margin:0 0 16px;color:#cbd8ff;font-size:13px;line-height:1.5}
.primary{min-width:112px;min-height:52px;border:0;border-radius:6px;background:#ffd10d;color:#171044;font-weight:1000;font-size:18px;box-shadow:0 4px 0 #ff8f00,0 0 14px #ffe84e66;cursor:pointer}
.countdown{font-size:84px!important;color:#ffd31a!important;text-shadow:4px 4px 0 #ff7a00,-2px -2px 0 #fff,0 0 15px #ffec67!important}
.screen{display:none;position:fixed;inset:0;z-index:40;background:#05063df5;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 16px);overflow:auto}
.screen.show{display:block}
.panel{max-width:430px;margin:0 auto;background:#11156f;border:1px solid #5668df;border-radius:8px;padding:16px}
.panel h2{margin:0 0 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;border-bottom:1px solid #343ca4}.row input{width:22px;height:22px;accent-color:#00dcef}.sub{width:100%;min-height:48px;margin-top:16px;border:1px solid #6478ee;border-radius:6px;background:#242a9c;color:#fff;font-weight:900}
.hint{font-size:11px;color:#a9b7ef;line-height:1.45;margin:10px 0 0}
@media(max-height:650px){.hud{min-height:42px;grid-template-columns:1fr 1fr 1.15fr 42px}.menuToggle{width:42px;min-height:42px}.hudBox b{font-size:16px}.hudBox small{font-size:7px}.floating{width:43px}.cover h2{font-size:24px}}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="hudBox"><small>Lines</small><b id="lines">0</b></div>
    <div class="hudBox"><small>Level</small><b id="level">1</b></div>
    <div class="hudBox scoreBox"><small>Score</small><b id="score">0</b></div>
    <div class="menuWrap">
      <button id="menuToggle" class="menuToggle" aria-label="Menu">☰</button>
      <div id="quickMenu" class="quickMenu">
        <button id="pauseBtn">Ⅱ&nbsp;&nbsp;Pause</button>
        <button id="soundBtn">🔊&nbsp;&nbsp;Sound</button>
        <button id="settingsBtn">⚙&nbsp;&nbsp;Settings</button>
      </div>
    </div>
  </div>
  <div class="gameArea" id="gameArea">
    <div class="boardWrap" id="boardWrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div id="holdPanel" class="floating"><small>HOLD</small><canvas id="hold" width="100" height="82"></canvas></div>
      <div id="nextPanel" class="floating"><small>NEXT</small><canvas id="next" width="100" height="222"></canvas></div>
      <div class="cover" id="cover"><div><h2 id="coverTitle">NEON BLOCKS</h2><p id="coverText">Tap to rotate · swipe to move/drop<br>Swipe up to hold · double tap to hard drop</p><button class="primary" id="start">PLAY</button></div></div>
    </div>
  </div>
</div>
<div class="screen" id="settingsScreen"><div class="panel"><h2>Settings</h2>
  <div class="row"><label for="sfxOn">Sound effects</label><input id="sfxOn" type="checkbox" checked></div>
  <div class="row"><label for="ghostOn">Ghost piece</label><input id="ghostOn" type="checkbox" checked></div>
  <div class="row"><label for="vibeOn">Vibration</label><input id="vibeOn" type="checkbox" checked></div>
  <p class="hint">Controls: tap = rotate, swipe left/right = move, swipe down = soft drop, quick downward flick or double tap = hard drop, swipe up or tap HOLD = hold piece.</p>
  <button class="sub" id="settingsDone">DONE</button>
</div></div>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id);
const canvas=$('board'),ctx=canvas.getContext('2d'),hc=$('hold').getContext('2d'),nc=$('next').getContext('2d');
const W=10,H=20,S=30;
const SHAPES={I:[[0,1],[1,1],[2,1],[3,1]],O:[[1,0],[2,0],[1,1],[2,1]],T:[[1,0],[0,1],[1,1],[2,1]],S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]]};
const COLORS={I:'#00dff1',O:'#ffd41a',T:'#b348ff',S:'#00e778',Z:'#ff334f',J:'#3585ff',L:'#ff9d00'};
const TYPES=Object.keys(SHAPES);
let board=[],queue=[],bag=[],piece=null,held=null,holdUsed=false,score=0,lines=0,level=1,best=0,started=false,paused=false,over=false,counting=false,dropAcc=0,previous=performance.now(),modalPause=false;
function getStore(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function putStore(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
best=getStore('high',0);
const prefs={sfx:getStore('sfxEnabled',true),ghost:getStore('ghostEnabled',true),vibrate:getStore('vibrateEnabled',true)};
$('sfxOn').checked=prefs.sfx;$('ghostOn').checked=prefs.ghost;$('vibeOn').checked=prefs.vibrate;
function resizeBoard(){const area=$('gameArea').getBoundingClientRect();if(area.width<=0||area.height<=0)return;const w=Math.floor(Math.min(area.width,area.height/2));const h=w*2;const wrap=$('boardWrap');wrap.style.width=w+'px';wrap.style.height=h+'px'}
window.addEventListener('resize',resizeBoard);requestAnimationFrame(resizeBoard);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function take(){while(queue.length<5){if(!bag.length)bag=shuffle(TYPES.slice());queue.push(bag.pop())}return queue.shift()}
function make(t){return {t,x:3,y:-1,blocks:SHAPES[t].map(p=>p.slice())}}
function fits(p,dx=0,dy=0,blocks=p.blocks){return blocks.every(([x,y])=>{const xx=p.x+x+dx,yy=p.y+y+dy;return xx>=0&&xx<W&&yy<H&&(yy<0||!board[yy][xx])})}
function spawn(){piece=make(take());holdUsed=false;if(!fits(piece)){gameOver();return}drawPreviews()}
function updateHud(){if(score>best){best=score;putStore('high',best)}$('score').textContent=score.toLocaleString();$('lines').textContent=String(lines);$('level').textContent=String(level)}
function newGameState(){board=Array.from({length:H},()=>Array(W).fill(null));queue=[];bag=[];piece=null;held=null;holdUsed=false;score=0;lines=0;level=1;dropAcc=0;over=false;paused=false;started=true;counting=false;updateHud();spawn();previous=performance.now()}
function cover(title,text,button){$('coverTitle').classList.remove('countdown');$('coverTitle').textContent=title;$('coverText').textContent=text;$('coverText').style.display='block';$('start').textContent=button;$('start').style.display='inline-block';$('cover').classList.remove('hidden')}
function hideCover(){$('cover').classList.add('hidden')}
function countdown(){if(counting)return;counting=true;started=false;over=false;$('cover').classList.remove('hidden');$('coverText').style.display='none';$('start').style.display='none';$('coverTitle').classList.add('countdown');let n=3;$('coverTitle').textContent=n;const timer=setInterval(()=>{n--;if(n>0){$('coverTitle').textContent=n;beep(210+n*45,.055,.35)}else{clearInterval(timer);$('coverTitle').classList.remove('countdown');$('coverText').style.display='block';$('start').style.display='inline-block';newGameState();hideCover();beep(460,.08,.55)}},650)}
function move(dx){if(!canPlay())return false;if(fits(piece,dx,0)){piece.x+=dx;beep(150,.025,.14);return true}return false}
function rotated(blocks){return blocks.map(([x,y])=>[3-y,x])}
function rotate(){if(!canPlay())return;const r=rotated(piece.blocks);for(const dx of [0,-1,1,-2,2])for(const dy of [0,-1,-2])if(fits(piece,dx,dy,r)){piece.x+=dx;piece.y+=dy;piece.blocks=r;beep(280,.045,.22);return}}
function softDrop(manual=true){if(!canPlay())return;if(fits(piece,0,1)){piece.y++;if(manual){score++;updateHud()}}else lockPiece()}
function hardDrop(){if(!canPlay())return;let d=0;while(fits(piece,0,1)){piece.y++;d++}score+=d*2;beep(190,.055,.34);vibe(22);lockPiece()}
function holdPiece(){if(!canPlay()||holdUsed)return;const t=piece.t;if(held===null){held=t;piece=make(take())}else{piece=make(held);held=t}holdUsed=true;if(!fits(piece)){gameOver();return}beep(330,.05,.25);drawPreviews()}
function canPlay(){return started&&!paused&&!over&&!counting&&piece}
function lockPiece(){let topped=false;for(const [x,y] of piece.blocks){const xx=piece.x+x,yy=piece.y+y;if(yy<0)topped=true;else if(xx>=0&&xx<W&&yy<H)board[yy][xx]=piece.t}if(topped){gameOver();return}let cleared=0;for(let y=H-1;y>=0;){if(board[y].every(Boolean)){board.splice(y,1);board.unshift(Array(W).fill(null));cleared++}else y--}if(cleared){score+=[0,100,300,500,800][cleared]*level;lines+=cleared;level=1+Math.floor(lines/10);lineSound(cleared);vibe(28)}else beep(118,.035,.18);updateHud();spawn()}
function gameOver(){over=true;started=false;piece=null;beep(92,.2,.28);cover('GAME OVER','Score '+score.toLocaleString()+' · Best '+best.toLocaleString(),'RESTART')}
function togglePause(){if(!started||over||counting)return;paused=!paused;$('pauseBtn').innerHTML=paused?'▶&nbsp;&nbsp;Resume':'Ⅱ&nbsp;&nbsp;Pause';if(paused)cover('PAUSED','Tap resume to continue','RESUME');else{hideCover();previous=performance.now()}}
window.togglePause=togglePause;
function vibe(ms){if(prefs.vibrate&&navigator.vibrate)navigator.vibrate(ms)}
let audioCtx=null;
function audio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume().catch(()=>{});return audioCtx}catch(e){return null}}
function beep(freq,dur=.05,vol=.2){if(!prefs.sfx)return;const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter(),now=a.currentTime;o.type='sine';o.frequency.value=freq;f.type='lowpass';f.frequency.value=900;const peak=.035*vol;g.gain.setValueAtTime(.0001,now);g.gain.linearRampToValueAtTime(peak,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(f);f.connect(g);g.connect(a.destination);o.start(now);o.stop(now+dur+.02)}
function lineSound(n){const a=[420,520,640,760];for(let i=0;i<Math.min(n+1,4);i++)setTimeout(()=>beep(a[i],.075,.34),i*42)}
function tile(c,x,y,color,ghost=false,scale=S){const px=x*scale,py=y*scale;c.save();c.globalAlpha=ghost?.24:1;c.fillStyle=color;c.shadowBlur=ghost?0:7;c.shadowColor=color;c.fillRect(px+1,py+1,scale-2,scale-2);c.shadowBlur=0;c.strokeStyle=ghost?'#dce8ff':'#ffffff55';c.lineWidth=ghost?1.2:1;c.strokeRect(px+1.5,py+1.5,scale-3,scale-3);if(!ghost){c.fillStyle='#ffffff33';c.fillRect(px+3,py+3,scale-6,Math.max(2,scale*.09))}c.restore()}
function drawBoard(){ctx.fillStyle='#10237e';ctx.fillRect(0,0,300,600);ctx.strokeStyle='#263ca0';ctx.lineWidth=.7;for(let x=1;x<W;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,600);ctx.stroke()}for(let y=1;y<H;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(300,y*S);ctx.stroke()}for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(board[y]?.[x])tile(ctx,x,y,COLORS[board[y][x]]);if(piece&&!over){if(prefs.ghost){let d=0;while(fits(piece,0,d+1))d++;piece.blocks.forEach(([x,y])=>{if(piece.y+y+d>=0)tile(ctx,piece.x+x,piece.y+y+d,COLORS[piece.t],true)})}piece.blocks.forEach(([x,y])=>{if(piece.y+y>=0)tile(ctx,piece.x+x,piece.y+y,COLORS[piece.t])})}}
function preview(c,t,yOffset=0){if(!t)return;const b=SHAPES[t],xs=b.map(v=>v[0]),ys=b.map(v=>v[1]),l=Math.min(...xs),r=Math.max(...xs),top=Math.min(...ys),sz=18,ox=(100-(r-l+1)*sz)/2,oy=yOffset+5;for(const [x,y] of b){c.save();c.translate(ox,oy);tile(c,x-l,y-top,COLORS[t],false,sz);c.restore()}}
function drawPreviews(){hc.clearRect(0,0,100,82);nc.clearRect(0,0,100,222);preview(hc,held,10);for(let i=0;i<3;i++)preview(nc,queue[i],i*70+3)}
function loop(now){requestAnimationFrame(loop);if(canPlay()){dropAcc+=Math.min(now-previous,250);const interval=Math.max(65,820*Math.pow(.82,level-1));if(dropAcc>=interval){softDrop(false);dropAcc-=interval}}previous=now;drawBoard()}
requestAnimationFrame(loop);
$('start').addEventListener('click',()=>{audio();if(paused){togglePause();return}countdown()});
$('pauseBtn').addEventListener('click',()=>{togglePause();$('quickMenu').classList.remove('open')});
$('menuToggle').addEventListener('click',e=>{e.stopPropagation();$('quickMenu').classList.toggle('open')});
$('soundBtn').addEventListener('click',()=>{prefs.sfx=!prefs.sfx;putStore('sfxEnabled',prefs.sfx);$('sfxOn').checked=prefs.sfx;$('soundBtn').innerHTML=(prefs.sfx?'🔊':'🔇')+'&nbsp;&nbsp;Sound';if(prefs.sfx)beep(440,.06,.35)});
$('settingsBtn').addEventListener('click',()=>{$('quickMenu').classList.remove('open');openSettings(true)});
document.addEventListener('pointerdown',e=>{if(!$('quickMenu').contains(e.target)&&e.target!==$('menuToggle'))$('quickMenu').classList.remove('open')});
function openSettings(show){$('settingsScreen').classList.toggle('show',show);if(show&&started&&!paused&&!over){modalPause=true;togglePause()}else if(!show&&modalPause){modalPause=false;if(paused)togglePause()}}
$('settingsDone').addEventListener('click',()=>openSettings(false));
$('sfxOn').addEventListener('change',e=>{prefs.sfx=e.target.checked;putStore('sfxEnabled',prefs.sfx);$('soundBtn').innerHTML=(prefs.sfx?'🔊':'🔇')+'&nbsp;&nbsp;Sound'});
$('ghostOn').addEventListener('change',e=>{prefs.ghost=e.target.checked;putStore('ghostEnabled',prefs.ghost)});
$('vibeOn').addEventListener('change',e=>{prefs.vibrate=e.target.checked;putStore('vibrateEnabled',prefs.vibrate)});
$('soundBtn').innerHTML=(prefs.sfx?'🔊':'🔇')+'&nbsp;&nbsp;Sound';
$('holdPanel').addEventListener('click',e=>{e.stopPropagation();holdPiece()});
let sx=0,sy=0,lastX=0,lastY=0,startTime=0,moved=false,lastTap=0;
canvas.addEventListener('pointerdown',e=>{if(!canPlay())return;audio();const r=canvas.getBoundingClientRect();sx=lastX=e.clientX;sy=lastY=e.clientY;startTime=performance.now();moved=false;canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!canPlay())return;const r=canvas.getBoundingClientRect(),cell=r.width/10,dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)>=cell*.72){const steps=Math.max(1,Math.floor(Math.abs(dx)/cell));for(let i=0;i<steps;i++)move(dx>0?1:-1);lastX=e.clientX;moved=true}if(dy>=cell*.78){const steps=Math.max(1,Math.floor(dy/cell));for(let i=0;i<steps;i++)softDrop(true);lastY=e.clientY;moved=true}});
canvas.addEventListener('pointerup',e=>{if(!canPlay())return;const totalY=e.clientY-sy,dt=performance.now()-startTime;if(totalY<-42){holdPiece();moved=true}else if(totalY>80&&dt<260){hardDrop();moved=true}if(!moved){const now=performance.now();if(now-lastTap<275){hardDrop();lastTap=0}else{rotate();lastTap=now}}});
document.addEventListener('keydown',e=>{const m={ArrowLeft:()=>move(-1),ArrowRight:()=>move(1),ArrowUp:rotate,ArrowDown:()=>softDrop(true),' ':hardDrop,c:holdPiece,C:holdPiece};if(m[e.key]){e.preventDefault();m[e.key]()}if(e.key==='Escape'||e.key==='p')togglePause()});
updateHud();drawPreviews();resizeBoard();
})();
</script>
</body>
</html>
