name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        id: compile
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Upload diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Blocks-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Report build failure to repository issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          log=open("build.log",errors="replace").read() if os.path.isfile("build.log") else "(no build log)"
          hits=[x.strip() for x in log.splitlines() if re.search(r"(^\s*> Task .*FAILED|^FAILURE:|^\* What went wrong:|^Execution failed|^.* error: |^.*AAPT:|^.*Could not .*|^.*Gradle .* failed)",x,re.I)]
          summary="\n".join(hits[-18:])[-4500:] if hits else log[-3500:]
          body="Automated Android APK build failed.\n\nRun: "+os.environ["RUN_URL"]+"\n\nBuild error excerpt:\n\n```\n"+summary+"\n```\n\nThe full log is available in the run artifacts."
          open("failure-report.md","w").write(body)
          PY
          gh issue create --repo "$REPO" --title "Neon Blocks: Android APK build failure" --body-file failure-report.md || true

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Blocks-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish directly downloadable APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view debug-latest >/dev/null 2>&1 || gh release create debug-latest --target "$GITHUB_SHA" --title "Neon Blocks Android Debug APK" --notes "Latest automated debug build. For testing and sideloading only." --prerelease
          gh release upload debug-latest app/build/outputs/apk/debug/app-debug.apk --clobber
